name: format-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format check
        run: python scripts/check_format.py
      - name: Link check (Paper / Code / Website must open)
        run: python scripts/check_links.py
